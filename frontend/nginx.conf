# $connection_upgrade must be defined for the WebSocket proxy below.
# conf.d/*.conf is included in the http context, so the map belongs here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cascade_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The REST surface. The dashboard talks to /api so its own routes — /pnl,
    # /history, /config — stay free for the SPA fallback below.
    location /api/ {
        proxy_pass http://cascade_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws/live
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Real detector frames, proxied to the backend's artifacts mount.
    # ^~ is required: without it the regex location below wins for *.png and the
    # frames 404 against the SPA root — images then work locally but not in Docker.
    location ^~ /frames/ {
        proxy_pass http://cascade_backend/frames/;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — a deep link or reload on /pnl, /history or /config must
    # return the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
